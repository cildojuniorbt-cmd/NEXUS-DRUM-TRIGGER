name: Build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar e compilar
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build --config Release --target test_core NexusDrumTrigger
      - name: Rodar testes do nucleo de audio
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Gerar instalador (Inno Setup)
        shell: pwsh
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'VERSION (\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\NexusDrumTrigger.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: win
          path: dist/NexusDrumTrigger-Setup.exe
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar e compilar (Intel + Apple Silicon)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build --config Release --target test_core NexusDrumTrigger
      - name: Rodar testes do nucleo de audio
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Gerar DMG (arrastar para Aplicativos)
        run: |
          APP="build/NexusDrumTrigger_artefacts/Release/Nexus Drum Trigger.app"
          codesign --force --deep --sign - "$APP"
          mkdir -p dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Aplicativos
          hdiutil create -volname "Nexus Drum Trigger" -srcfolder dmg -ov -format UDZO NexusDrumTrigger-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: NexusDrumTrigger-macOS.dmg
  release:
    needs: [windows, macos]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest dist/NexusDrumTrigger-Setup.exe dist/NexusDrumTrigger-macOS.dmg --target ${{ github.sha }} --title "Nexus Drum Trigger" --notes "Windows: baixe e execute NexusDrumTrigger-Setup.exe. Mac: abra o DMG e arraste o app para Aplicativos; na primeira vez, clique com o botao direito no app e escolha Abrir."
