name: Build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar e compilar
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build --config Release --target test_core NexusDrumTrigger
      - name: Rodar testes do nucleo de audio
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Empacotar
        shell: pwsh
        run: |
          Compress-Archive -Path "build/NexusDrumTrigger_artefacts/Release/Nexus Drum Trigger.exe" -DestinationPath NexusDrumTrigger-Windows.zip
      - name: Publicar Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest NexusDrumTrigger-Windows.zip --title "Nexus Drum Trigger (Windows)" --notes "Baixe o zip, extraia e abra o Nexus Drum Trigger.exe."
      - uses: actions/upload-artifact@v4
        with:
          name: NexusDrumTrigger-Windows
          path: build/NexusDrumTrigger_artefacts/Release/
