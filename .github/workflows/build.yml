name: Build
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar e compilar
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target test_core NexusDrumTrigger
      - name: Rodar testes do nucleo de audio
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: NexusDrumTrigger-Windows
          path: build/NexusDrumTrigger_artefacts/Release/
